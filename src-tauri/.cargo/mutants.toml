# cargo-mutants configuration — see https://mutants.rs
#
# Excluded code (with reasons):
# - main.rs / lib.rs: process bootstrap and Tauri builder glue, only
#   executable in a real app run.
# - commands.rs: `#[tauri::command]` attribute plumbing that just forwards to
#   app.rs; the logic it calls is fully mutated and tested there.
# - hosts_file/writer.rs: osascript/pkexec shell-outs that cannot run in CI;
#   trait-selected platform code exercised manually per the test plan.
# - Test modules are skipped by cargo-mutants automatically.
exclude_globs = [
  "src/main.rs",
  "src/lib.rs",
  "src/commands.rs",
  "src/hosts_file/writer.rs",
]

# Two accepted equivalent mutants (unkillable by any input):
# - stevenblack.rs parse_baseline `||`->`&&` on `is_empty() || starts_with('#')`:
#   with && the guard never fires, but the loop body drops empty and comment
#   lines identically (their first '#' or whitespace split yields no fields).
# - render.rs merge `<`->`<=` on `end_idx < begin_idx`: the two distinct
#   markers can never start at the same byte index, so equality is impossible.
exclude_re = [
  "replace \\|\\| with && in parse_baseline",
  "replace < with <= in merge",
]
